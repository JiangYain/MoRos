<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass Logo Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 358.4px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      transition: transform 180ms cubic-bezier(0,0,0.2,1);
      transform-origin: center;
    }

    .atom-stage [data-atom-part] {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 180ms cubic-bezier(0,0,0.2,1), opacity 180ms cubic-bezier(0,0,0.2,1);
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 1200ms;
        --p2m-ease-enter: cubic-bezier(0, 0, 0.2, 1);
        --p2m-ease-settle: cubic-bezier(0.4, 0, 0.2, 1);
        --p2m-ease-narrative: cubic-bezier(0.34, 0, 0.14, 1);
      }

      #logo {
        isolation: isolate;
      }

      #mark-base,
      #mark-direction {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity, clip-path, filter;
      }

      #mark-base {
        animation: p2m-base-build var(--p2m-duration) linear both;
      }

      #mark-direction {
        animation: p2m-direction-arrive var(--p2m-duration) linear both;
      }

      @keyframes p2m-base-build {
        0%,
        20% {
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          transform: translateX(-12px) scale(0.985);
          /* --p2m-ease-narrative */
          animation-timing-function: cubic-bezier(0.34, 0, 0.14, 1);
        }

        63% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          transform: translateX(0) scale(1);
          /* --p2m-ease-settle */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        100% {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          transform: translateX(0) scale(1);
        }
      }

      @keyframes p2m-direction-arrive {
        0%,
        35% {
          opacity: 0;
          filter: drop-shadow(0 0 0 rgba(217, 70, 50, 0));
          transform: translate(24px, 30px) rotate(1.5deg);
          /* --p2m-ease-enter */
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }

        58% {
          opacity: 1;
          filter: drop-shadow(0 0 5px rgba(217, 70, 50, 0.12));
          transform: translate(5px, -4px) rotate(0.25deg);
          /* --p2m-ease-settle */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        76% {
          opacity: 1;
          filter: drop-shadow(0 0 8px rgba(217, 70, 50, 0.18));
          transform: translate(-2px, -2px) rotate(-0.15deg);
          /* --p2m-ease-settle */
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        90%,
        100% {
          opacity: 1;
          filter: drop-shadow(0 0 0 rgba(217, 70, 50, 0));
          transform: translate(0, 0) rotate(0);
        }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1200"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Guide</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Focus</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Direction</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"id":"logo","width":"512","height":"512","viewBox":"0 0 512 512","role":"img","aria-labelledby":"logo-title","shape-rendering":"geometricPrecision"},"children":[{"tag":"title","attrs":{"id":"logo-title"},"children":[],"text":"Compass"},{"tag":"svg","attrs":{"id":"logo-art","x":"42","y":"38","width":"428","height":"428","viewBox":"0 0 732 732","overflow":"visible"},"children":[{"tag":"g","attrs":{"transform":"translate(-78,-133.5) translate(0,499.5) scale(1,0.8541423571) translate(0,-499.5)"},"children":[{"tag":"g","attrs":{"id":"mark-base"},"children":[{"tag":"path","attrs":{"d":"M 280 71 L 78 214 L 78 928 L 552 928 L 552 854 L 169 852 L 299 722 L 603 722 L 608 695 L 307 694 L 307 316 L 280 316 L 280 702 L 152 829 L 152 290 L 552 289 L 552 215 L 128 213 L 288 98 L 754 98 L 806 71 Z","fill":"#111111"},"children":[]}]},{"tag":"g","attrs":{"id":"mark-direction"},"children":[{"tag":"path","attrs":{"d":"M 810 103 L 594 215 L 597 287 L 716 229 L 594 927 L 666 927 L 810 783 L 807 700 L 688 803 Z","fill":"#D94632"},"children":[]}]}]}]}]};
    const SVG_TEXT = "<svg\n  id=\"logo\"\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"512\"\n  height=\"512\"\n  viewBox=\"0 0 512 512\"\n  role=\"img\"\n  aria-labelledby=\"logo-title\"\n  shape-rendering=\"geometricPrecision\"\n><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <title id=\"logo-title\">Compass<\/title>\n  <svg id=\"logo-art\" x=\"42\" y=\"38\" width=\"428\" height=\"428\" viewBox=\"0 0 732 732\" overflow=\"visible\">\n    <g transform=\"translate(-78,-133.5) translate(0,499.5) scale(1,0.8541423571) translate(0,-499.5)\">\n      <g id=\"mark-base\">\n        <path\n          d=\"M 280 71 L 78 214 L 78 928 L 552 928 L 552 854 L 169 852 L 299 722 L 603 722 L 608 695 L 307 694 L 307 316 L 280 316 L 280 702 L 152 829 L 152 290 L 552 289 L 552 215 L 128 213 L 288 98 L 754 98 L 806 71 Z\"\n          fill=\"#111111\"\n        />\n      <\/g>\n      <g id=\"mark-direction\">\n        <path\n          d=\"M 810 103 L 594 215 L 597 287 L 716 229 L 594 927 L 666 927 L 810 783 L 807 700 L 688 803 Z\"\n          fill=\"#D94632\"\n        />\n      <\/g>\n    <\/g>\n  <\/svg>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1200;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "slowinout"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomLogos() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const svg = createSvgNode(LOGO);
        svg.removeAttribute("id");
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.querySelectorAll("[id]").forEach(part => {
          part.dataset.atomPart = part.id;
          part.removeAttribute("id");
        });
        svg.setAttribute("aria-hidden", "true");
        stage.appendChild(svg);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] [data-atom-part="mark-direction"]');
      const pulse = document.querySelector('[data-atom="pulse"] [data-atom-part="mark-direction"]');
      const arc = document.querySelector('[data-atom="arc"] [data-atom-part="mark-direction"]');
      const press = document.querySelector('[data-atom="press"] svg');
      const hoverStage = document.querySelector('[data-atom="hover"] .atom-stage');
      const arcStage = document.querySelector('[data-atom="arc"] .atom-stage');

      hoverStage.addEventListener("mouseenter", () => {
        flashPills("slowinout", "appeal");
        hover.style.transform = "translate(3px, -3px)";
      });
      hoverStage.addEventListener("mouseleave", () => {
        hover.style.transform = "translate(0, 0)";
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulse.animate(
          [
            { opacity: 0.72, transform: "scale(0.985)" },
            { opacity: 1, transform: "scale(1)" },
            { opacity: 0.72, transform: "scale(0.985)" },
          ],
          { duration: 2200, iterations: Infinity, easing: "cubic-bezier(0.4,0,0.6,1)" },
        );
      }

      arcStage.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "slowinout");
        arc.animate(
          [
            { transform: "translate(5px, 7px) rotate(0.8deg)" },
            { transform: "translate(-2px, -2px) rotate(-0.15deg)", offset: 0.72 },
            { transform: "translate(0, 0) rotate(0)" },
          ],
          { duration: 520, easing: "cubic-bezier(0,0,0.2,1)" },
        );
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("anticipation", "timing", "appeal");
        press.style.transform = "scale(0.96)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomLogos();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
