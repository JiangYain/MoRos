name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发，便于调试 smoke job
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 的新提交会取消仍在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: compass

jobs:
  # 必跑检查：安装、类型检查、单元/行为测试、Provider 审计和构建。
  # typecheck/build 不需要 Electron 二进制（Electron 43 起安装时不再下载），
  # 因此这个 job 只依赖 npm 缓存，速度最快。
  check:
    name: Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            compass/package-lock.json
            compass/vendor/pi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and behavior tests
        run: npm run test:unit

      - name: Provider registry audit
        run: npm run audit:providers:static

      - name: Build
        run: npm run build

  # UI 冒烟测试：构建后驱动真实 Electron 应用完成分场景截图走查。
  # 这是 PR 的阻断检查，失败截图会上传供定位。
  smoke:
    name: UI Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            compass/package-lock.json
            compass/vendor/pi/package-lock.json

      # Electron 43 的二进制在首次使用时才下载（~120MB），缓存 @electron/get
      # 的下载目录，避免每次 CI 都从 GitHub Releases 重新拉取
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('compass/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # xvfb：Electron 无法真 headless，需要虚拟显示（runner 镜像通常自带，装一次求稳）
      # fonts-noto-cjk：UI 文案为中文，无 CJK 字体时截图会显示方块字，失去排查价值
      - name: Install system deps (xvfb, CJK fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      # 显式预下载 Electron 二进制（幂等；命中缓存时只做解压），
      # 让下载耗时/失败在独立步骤中暴露，而不是混在 smoke 里
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # GitHub 托管 runner 上 Chromium SUID sandbox 不可用，需显式禁用
      - name: Run smoke test
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: compass/smoke-out/
          if-no-files-found: ignore
          retention-days: 7
